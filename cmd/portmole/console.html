<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portmole console</title>
<style>
  :root { --paper: #f1f3ef; --surface: #fff; --ink: #121815; --muted: #57625c; --line: #d5dad3; --shaft: #d98a12; --link: #1c3df0; --bad: #a3261a;
    --mono: ui-monospace, "JetBrains Mono", Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #131715; --surface: #1b211e; --ink: #e9eeea; --muted: #9aa69f; --line: #2c3530; --shaft: #f0a93a; --link: #8ea2ff; --bad: #ff8a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem 4rem; display: flex; flex-direction: column; gap: 1.5rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; }
  h1 span { color: var(--shaft); }
  .mono, input, code { font-family: var(--mono); font-size: .9rem; }
  .muted { color: var(--muted); }
  form, article { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  form { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
  label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--muted); }
  input { padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); min-width: 0; }
  input[name=port] { width: 7rem; }
  button { font: 500 .9rem system-ui, sans-serif; padding: .5rem .9rem; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.main { background: var(--link); border-color: var(--link); color: #fff; }
  @media (prefers-color-scheme: dark) { button.main { color: #0d1330; } }
  :focus-visible { outline: 2px solid var(--shaft); outline-offset: 2px; }
  #error { color: var(--bad); min-height: 1.5rem; margin: 0; }
  article { display: flex; flex-direction: column; gap: .75rem; border-left: 3px solid var(--shaft); }
  .top { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; align-items: center; }
  .top a { color: var(--link); font-family: var(--mono); font-size: .95rem; overflow-wrap: anywhere; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .log { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: .82rem; }
  td { padding: .25rem .75rem .25rem 0; white-space: nowrap; border-top: 1px solid var(--line); }
  td:last-child { white-space: normal; overflow-wrap: anywhere; width: 100%; }
  .s4, .s5 { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>p</span>ortmole console</h1>
    <span class="muted mono" id="usage"></span>
  </header>

  <form id="open">
    <label>Local port <input name="port" type="number" min="1" max="65535" placeholder="3000" required></label>
    <label>Name (optional) <input name="name" placeholder="my-shop" maxlength="26" pattern="[A-Za-z0-9 _.\-]*"></label>
    <button class="main">Open tunnel</button>
  </form>
  <p id="error" role="alert"></p>

  <section id="tunnels" aria-live="polite"></section>
  <p class="muted">Tunnels opened here close when the <code>portmole console</code> command stops. The part of an address after the last dash is your GitHub name and cannot be changed.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const size = n => n < 1e6 ? Math.round(n / 1e3) + " KB" : n < 1e9 ? (n / 1e6).toFixed(1) + " MB" : (n / 1e9).toFixed(2) + " GB";

// Every text from outside (paths, names) goes in through textContent only.
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function call(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "the request failed");
  return data;
}

async function act(path, body) {
  try {
    show(await call(path, body));
    $("error").textContent = "";
  } catch (e) {
    $("error").textContent = e.message;
  }
}

function show(state) {
  $("usage").textContent = state.allowance > 0 ? "Data today: " + size(state.used) + " of " + size(state.allowance) : "";
  const list = $("tunnels");
  list.replaceChildren(...state.tunnels.map(t => {
    const a = el("article");
    const top = el("div", null, "top");
    const link = el("a", t.url);
    link.href = t.url; link.target = "_blank"; link.rel = "noopener";
    const left = el("div");
    left.append(link, el("div", "→ localhost:" + t.port, "muted mono"));
    const actions = el("div", null, "actions");
    const copy = el("button", "Copy address");
    copy.onclick = () => navigator.clipboard.writeText(t.url).then(() => { copy.textContent = "Copied"; });
    const rename = el("button", "Rename");
    rename.onclick = () => {
      const to = prompt("New name. The old address stops working.", t.name);
      if (to && to !== t.name) act("/api/rename", { name: t.name, to });
    };
    const close = el("button", "Close");
    close.onclick = () => act("/api/close", { name: t.name });
    actions.append(copy, rename, close);
    top.append(left, actions);
    a.append(top);
    const reqs = (t.requests || []).slice().reverse();
    if (!reqs.length) {
      a.append(el("div", "No requests yet.", "muted"));
    } else {
      const table = el("table");
      for (const q of reqs) {
        const tr = el("tr");
        tr.append(el("td", new Date(q.time).toLocaleTimeString()), el("td", q.method),
          el("td", q.status, "s" + Math.floor(q.status / 100)), el("td", q.ms + " ms"), el("td", q.path));
        table.append(tr);
      }
      const wrap = el("div", null, "log");
      wrap.append(table);
      a.append(wrap);
    }
    return a;
  }));
  if (!state.tunnels.length) list.append(el("p", "No tunnels are open. Enter a port above.", "muted"));
}

$("open").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  await act("/api/open", { port: Number(f.port.value), name: f.name.value.trim() });
  if (!$("error").textContent) f.reset();
};

async function refresh() {
  try { show(await call("/api/state")); } catch { /* the command stopped or is reconnecting */ }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
