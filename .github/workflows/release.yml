name: release

# Pushing a tag like v0.2.0 builds the six programs, publishes a GitHub
# release with them and, when the NPM_TOKEN secret is set, the npm packages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm: ${{ steps.npm.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/bin dist/release
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/portmole/portmole/mcp.Version=$VERSION" \
              -o "dist/bin/portmole-$os-$arch$ext" ./cmd/portmole
            stage=$(mktemp -d)
            cp "dist/bin/portmole-$os-$arch$ext" "$stage/portmole$ext"
            cp LICENSE README.md "$stage/"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/release/portmole-$VERSION-$os-$arch.zip" ./*)
            else
              tar -czf "dist/release/portmole-$VERSION-$os-$arch.tar.gz" -C "$stage" .
            fi
          done
          (cd dist/release && sha256sum -- * > SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: dist/bin
          retention-days: 1

  npm:
    needs: build
    if: needs.build.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: dist/bin
      - run: node npm/build.js "${{ needs.build.outputs.version }}" dist/bin dist/npm
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The platform packages go first, so "portmole" never points at a
        # version of them that is not there yet.
        run: |
          for dir in dist/npm/*-*; do
            (cd "$dir" && npm publish --access public)
          done
          (cd dist/npm/portmole && npm publish --access public)
